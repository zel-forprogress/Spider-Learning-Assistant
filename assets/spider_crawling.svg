  <path d="M82,62 Q104,65 114,60" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M82,70 Q104,72 114,78" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80,78 Q96,84 104,92" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
