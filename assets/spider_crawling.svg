  <!-- Left legs - animated up -->
  <path d="M40,55 Q22,35 10,28" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38,62 Q16,55 5,48" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38,70 Q16,80 6,88" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40,78 Q24,92 16,102" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right legs - animated down -->
