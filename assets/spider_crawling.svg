  <!-- Head -->
  <circle cx="60" cy="42" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Eyes - wider open -->
  <circle cx="54" cy="38" r="4.5" fill="#22c55e"/>
  <circle cx="66" cy="38" r="4.5" fill="#22c55e"/>
  <circle cx="55.5" cy="37" r="2" fill="white"/>
