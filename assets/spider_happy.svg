  <path d="M82,62 Q102,55 112,48" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M82,70 Q102,76 112,82" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80,78 Q98,88 105,98" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
