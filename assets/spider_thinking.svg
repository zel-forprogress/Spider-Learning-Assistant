<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Spider body -->
  <ellipse cx="60" cy="65" rx="22" ry="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="60" cy="42" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Eyes - squinting -->
  <path d="M50,38 Q54,35 58,38" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M62,38 Q66,35 70,38" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Left legs -->
  <path d="M40,55 Q20,42 12,32" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38,62 Q18,58 8,52" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38,70 Q18,76 8,82" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40,78 Q22,88 15,98" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right legs -->
  <path d="M80,55 Q100,42 108,32" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M82,62 Q102,58 112,52" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M82,70 Q102,76 112,82" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80,78 Q98,88 105,98" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Thinking bubble -->
  <circle cx="85" cy="28" r="6" fill="#334155" opacity="0.8"/>
  <circle cx="95" cy="18" r="4" fill="#334155" opacity="0.6"/>
  <circle cx="102" cy="10" r="2.5" fill="#334155" opacity="0.4"/>
  <!-- Neutral mouth -->
  <line x1="55" y1="46" x2="65" y2="46" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
